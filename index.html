<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>城市空间立体诊断展示系统</title><link rel='stylesheet' href='styles.css'></head><body><main class='app'><aside class='sidebar'><div class='eyebrow'>WEB GIS RESEARCH PORTAL</div><h1>城市空间立体诊断展示系统</h1><p class='subtitle'>基于 ArcGIS Pro 导出数据构建的“需求 - 可达性 - 人本感知”交互展示平台。</p><div class='nav'><button data-key='gvi' onclick="switchMap('gvi',this)"><strong>平视绿视率（GVI）</strong><span class='tag'>微观感知</span></button><button data-key='ols' onclick="switchMap('ols',this)"><strong>OLS 回归标准残差</strong><span class='tag'>供需诊断</span></button><button data-key='service' onclick="switchMap('service',this)"><strong>15 分钟慢行服务区</strong><span class='tag'>网络覆盖</span></button><button data-key='accessibility' onclick="switchMap('accessibility',this)"><strong>就业机会点与服务区可达性</strong><span class='tag'>中观配置</span></button></div><section class='insight' id='panel'></section><p class='muted' style='font-size:.75rem;margin-top:22px'>数据：GVI.xls · OLS.geojson · SAA.geojson · Accessability.xls<br>地图：Folium / Leaflet</p></aside><section class='map'><iframe id='map' title='交互地图'></iframe></section></main><script>const layers={"gvi": {"title": "平视绿视率（GVI）", "tag": "微观感知", "file": "map_gvi.html", "metric": "3.33%", "metric_label": "GVI 中位数", "summary": "覆盖 31,514 个街景采样点，其中 18,147 个点的绿视率低于 5%。", "steps": ["从 ArcGIS 导出的点表读取 Longitude、Latitude 与 GVI_Score 字段。", "以 5% 和 15% 为阈值进行分级，展示行人视角下的绿色暴露差异。", "点击或悬停点位查看绿视率与道路类型。"], "method": "GVI = 绿植像素数 / 图像总像素数 × 100%"}, "ols": {"title": "OLS 回归标准残差", "tag": "供需诊断", "file": "map_ols.html", "metric": "7", "metric_label": "高正残差单元（> 2.5）", "summary": "共 292 个 TPU 面单元；红色单元代表观测交通量显著高于模型预测。", "steps": ["加载 OLS.geojson 的 TPU 面单元和 StdResid 字段。", "标准残差 > 2.5 标为红色高正残差；0–2.5 标为橙色；其余为蓝色。", "悬停查看 TPU 编号、观测交通量与就业岗位数。"], "method": "StdResid = (观测值 − 预测值) / 残差标准差"}, "service": {"title": "15 分钟慢行服务区", "tag": "网络覆盖", "file": "map_service.html", "metric": "3", "metric_label": "服务时间圈层", "summary": "从 SAA.geojson 读取服务区面，按实际导出的 0–5、5–10、10–15 分钟时间阻抗分级。", "steps": ["加载 ArcGIS Network Analyst 导出的 GeoJSON 服务区面。", "按 FromBreak 和 ToBreak 映射 0–5、5–10、10–15 分钟色阶。", "悬停查看服务圈层的时间范围。"], "method": "服务区基于网络时间阻抗生成；本图直接使用 ArcGIS 导出的圈层结果。"}, "accessibility": {"title": "就业机会点与服务区可达性", "tag": "中观配置", "file": "map_accessibility.html", "metric": "5,724", "metric_label": "有效就业机会点", "summary": "从 Accessability.xls 读取 5,724 个点位，以 Total_jobs 的分位色阶呈现就业岗位集聚，并在弹窗展示服务区到达时间。", "steps": ["读取 point_x、point_y、Total_jobs 和服务区 ToBreak 字段。", "以就业岗位数的 98 分位截断生成连续色阶，减少极端值对视觉的影响。", "点击点位查看 TPU 编号、岗位数和服务区到达时间。"], "method": "本数据未包含 Acc_Score；图层按 Total_jobs 呈现就业机会，并显示已关联的服务区时间。"}};function switchMap(key,el){const d=layers[key];document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelector('#map').src=d.file;document.querySelector('#panel').innerHTML=`<h2>${d.title}</h2><p>${d.summary}</p><a class='detail-link' href='detail_${key}.html'>查看详细数据与分析流程 →</a>`;}switchMap('gvi',document.querySelector("[data-key='gvi']"));</script></body></html>
